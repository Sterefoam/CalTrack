services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: file:/data/caltrack.db
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set your public HTTPS app URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters}
      CHAT_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
    volumes:
      - app-data:/data
    depends_on:
      model-init:
        condition: service_completed_successfully
  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - model-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
  model-init:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:4b"]
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  app-data:
  model-data:
